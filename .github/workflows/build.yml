name: Build APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ekstrak project dari zip
        run: unzip -o HanifCutVideo.zip -d .
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Generate Gradle Wrapper
        working-directory: HanifCutVideo
        run: gradle wrapper --gradle-version 8.9
      - name: Build APK
        working-directory: HanifCutVideo
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: HanifCutVideo-apk
          path: HanifCutVideo/app/build/outputs/apk/debug/app-debug.apk
